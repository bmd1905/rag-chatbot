<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; flex: 1; display: flex; flex-direction: column; width: 100%; }
        h1 { text-align: center; margin-bottom: 20px; color: #00d9ff; }
        #chat { flex: 1; overflow-y: auto; padding: 10px; background: #16213e; border-radius: 10px; margin-bottom: 15px; }
        .message { margin: 10px 0; padding: 12px; border-radius: 8px; max-width: 80%; }
        .user { background: #0f3460; margin-left: auto; }
        .assistant { background: #1a1a2e; border: 1px solid #333; }
        .sources { font-size: 0.8em; color: #888; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; }
        #input-area { display: flex; gap: 10px; }
        #input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #16213e; color: #eee; font-size: 16px; }
        #input:focus { outline: 2px solid #00d9ff; }
        button { padding: 12px 24px; background: #00d9ff; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00b8d4; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 RAG Chatbot</h1>
        <div id="chat"></div>
        <div id="input-area">
            <input type="text" id="input" placeholder="Ask me anything..." autofocus>
            <button id="send">Send</button>
        </div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        function addMessage(content, role, sources = []) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = content;
            if (sources.length > 0) {
                div.innerHTML += `<div class="sources"><strong>Sources:</strong><br>${sources.map(s => `• ${s}`).join('<br>')}</div>`;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            sendBtn.disabled = true;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                addMessage(data.response, 'assistant', data.sources);
            } catch (e) {
                addMessage('Error: Could not connect to server', 'assistant');
            }
            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.onclick = sendMessage;
        input.onkeypress = (e) => e.key === 'Enter' && sendMessage();
    </script>
</body>
</html>
