coverage:
  status:
    # Fail PRs that reduce total coverage
    project:
      default:
        target: 80
        threshold: 1%
    # Warn if patch coverage is below 70%
    patch:
      default:
        target: 70
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
